function renderIDPContent() {
  var personId = document.getElementById('idpSelect').value;
  var container = document.getElementById('idpContent');
  if (!personId) { container.innerHTML = ''; return; }

  var person = PEOPLE.find(function(p) { return p.id === personId; });
  if (!person) return;
  var scores = getEffectiveScores(person);
  var tgt = getTarget(person);

  // Check certifications
  var certNames = [];
  Object.keys(COURSE_CERTS).forEach(function(key) {
    if (COURSE_CERTS[key].indexOf(personId) >= 0) {
      var courseNames = key.split(',').map(function(code) {
        var found = COURSES.find(function(c) { return c[0] === code; });
        return found ? code + ' · ' + found[1] : code;
      });
      certNames = certNames.concat(courseNames);
    }
  });

  // Overall stats
  var totalSkills = 0, totalGap = 0, coreSkills = 0, coreGap = 0, funcSkills = 0, funcGap = 0;
  SKILLS.forEach(function(sk, i) {
    var val = scores[i];
    var tVal = tgt[i];
    var gap = (val === null || val === undefined) ? -tVal : val - tVal;
    totalSkills++; totalGap += gap;
    if (sk.ax === 'C') { coreSkills++; coreGap += gap; }
    else if (sk.ax !== 'C') { funcSkills++; funcGap += gap; }
  });

  var html = '';

  // Person header bar
  var corePct = coreSkills > 0 ? Math.round((coreSkills - Math.abs(coreGap)) / coreSkills * 100) : 0;
  var funcPct = funcSkills > 0 ? Math.round((funcSkills - Math.abs(funcGap)) / funcSkills * 100) : 0;
  html += '<div style="display:flex;align-items:baseline;gap:10px;margin-bottom:16px;">';
  html += '<strong style="font-size:16px;">'+person.name+'</strong>';
  html += '<span style="color:var(--ink-muted);font-size:12.5px;">'+person.team+' · '+person.pos+' · '+corePct+'%</span>';
  html += '<span style="color:var(--primary);font-size:11.5px;margin-left:auto;">'+t('Nền tảng','Core')+' '+corePct+'%</span>';
  html += '<span style="color:#F5A66E;font-size:11.5px;">'+t('Chức năng','Functional')+' '+funcPct+'%</span>';
  html += '</div>';

  // Two-column grid: Scores + Trend
  html += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:16px;margin-bottom:16px;">';

  // LEFT: Scores by category
  html += '<section style="background:#fff;border:1px solid var(--border);padding:16px 18px;">';
  html += '<h2 style="font-size:13px;font-weight:600;margin:0 0 10px;">'+t('Điểm theo nhóm kỹ năng','Scores by category')+'</h2>';
  SKILLS.forEach(function(sk, i) {
    var val = scores[i];
    var tVal = tgt[i];
    var gap = (val === null || val === undefined) ? -tVal : val - tVal;
    var isNull = val === null || val === undefined;
    var axColor = sk.ax === 'C' ? 'var(--axis-soft)' : (sk.ax === 'B' ? 'var(--axis-language)' : 'var(--primary)');

    html += '<div style="display:flex;align-items:center;gap:10px;padding:4px 0;border-top:1px solid var(--border);">';
    // Skill name
    html += '<span style="flex:1 0 0;font-size:12px;color:'+axColor+';font-weight:500;">'+skillName(i)+'</span>';
    // 2x2 dot grid
    html += '<div style="display:grid;grid-template-columns:7px 7px;grid-template-rows:7px 7px;gap:2px;">';
    for (var d = 0; d < 4; d++) {
      var filled = !isNull && d < val;
      html += '<span style="width:7px;height:7px;background:'+(filled?axColor:'var(--border)')+';display:block;"></span>';
    }
    html += '</div>';
    // Required
    html += '<span style="font-size:11px;color:var(--ink-muted);width:56px;text-align:right;">'+t('Yêu cầu','Required')+' '+tVal+'</span>';

  html += '<span style="display:flex;align-items:center;gap:3px;font-size:10px;color:var(--ink-muted);"><i style="width:7px;height:7px;background:var(--primary);display:block;border-radius:50%;"></i> '+t('Kỹ thuật','Technical')+'</span>';
  html += '<span style="display:flex;align-items:center;gap:3px;font-size:10px;color:var(--ink-muted);"><i style="width:7px;height:7px;background:#F5A66E;display:block;border-radius:50%;"></i> '+t('Ứng dụng','Application')+'</span>';
  html += '<span style="display:flex;align-items:center;gap:3px;font-size:10px;color:var(--ink-muted);"><i style="width:7px;height:7px;background:#1F6459;display:block;border-radius:50%;"></i> '+t('Hành vi','Behavioral')+'</span>';

      html += '<span style="background:#E5EFEC;color:#2F7355;border:1px solid #C4DFD8;padding:3px 9px;font-size:11px;">'+cn+'</span>';
    });
    html += '</div></div>';
  }

  // Evidence
  html += '<label style="display:block;margin-top:10px;font-size:11.5px;color:var(--ink-muted);">'+t('Minh chứng / Ghi chú tiến độ','Evidence / progress notes')+'<input id="idpEvidence" placeholder="'+t('VD: Kaizen + số liệu','e.g. Kaizen + data')+'" style="display:block;width:100%;margin-top:4px;border:1px solid var(--border);padding:5px 7px;"></label>';
  html += '</section>';
  html += '</div>';

  // Two-column grid: Gap rankings
  html += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;">';

  // LEFT: Needed to meet current position
  html += '<section style="background:#fff;border:1px solid var(--border);padding:16px 18px;">';
  html += '<h2 style="font-size:13px;font-weight:600;margin:0 0 10px;">'+t('Cần đạt để đúng vị trí hiện tại','Needed to meet the current position')+'</h2>';
  var meetCurrent = [];
  SKILLS.forEach(function(sk, i) {
    var val = scores[i];
    var tVal = tgt[i];
    var gap = (val === null || val === undefined) ? -tVal : val - tVal;
    if (gap < 0) {
      meetCurrent.push({ name: skillName(i), gap: gap, course: SKILL_COURSE[i] });
    }
  });
  meetCurrent.sort(function(a, b) { return a.gap - b.gap; });
  if (meetCurrent.length === 0) {
    html += '<div style="font-size:12px;color:var(--ink-muted);">'+t('Đủ chuẩn vị trí hiện tại','Meets current position requirements')+'</div>';
  } else {
    meetCurrent.forEach(function(mc) {
      var courseInfo = mc.course ? COURSES.find(function(c) { return c[0] === mc.course; }) : null;
      html += '<div style="display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-top:1px solid var(--border);font-size:12px;">';
      html += '<span>'+mc.name+'</span>';
      html += '<span style="color:var(--ink-muted);text-align:right;">'+(mc.course||'—')+(courseInfo?' · '+courseInfo[1]:'')+'</span>';
      html += '</div>';
    });
  }
  html += '</section>';

  // RIGHT: Needed to move up
  html += '<section style="background:#fff;border:1px solid var(--border);padding:16px 18px;">';
  html += '<h2 style="font-size:13px;font-weight:600;margin:0 0 10px;">'+t('Cần đạt để lên Supervisor','Needed to move up to Supervisor')+'</h2>';

    var supervisorGap = (val === null || val === undefined) ? -supervisorTarget : val - supervisorTarget;
    if (supervisorGap < 0) {
      moveUp.push({ name: skillName(i), gap: supervisorGap, course: SKILL_COURSE[i] });
    }
  });

    html += '<div style="font-size:12px;color:var(--ink-muted);">'+t('Đủ chuẩn Supervisor','Meets Supervisor requirements')+'</div>';

      var courseInfo = mu.course ? COURSES.find(function(c) { return c[0] === mu.course; }) : null;
      html += '<div style="display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-top:1px solid var(--border);font-size:12px;">';

      html += '</div>';
    });

  html += '<section style="background:#fff;border:1px solid var(--border);padding:16px 18px;margin-top:16px;">';

function renderIDPTrendChart(person) {
  var periods = ['H1_24','H2_24','H1_25','H2_25'];
  var periodLabels = ['Jan 2024','Jul 2024','Jan 2025','Jul 2025'];
  var axKeys = ['T','A','C'];
  var axColors = ['var(--primary)','var(--axis-language)','var(--axis-soft)'];
  var axNames = [t('Kỹ thuật','Technical'), t('Ứng dụng','Application'), t('Hành vi','Behavioral')];

  var W = 260, H = 100, padL = 2, padR = 2, padT = 5, padB = 5;
  var pts = [];
  axKeys.forEach(function(ax, ai) {
    var series = [];
    periods.forEach(function(per) {
      var data = examScores[per] && examScores[per][person.id];
      if (!data) { series.push(null); return; }
      var total = 0, count = 0;
      SKILLS.forEach(function(sk, si) {
        if (sk.ax === ax && data[si] !== null && data[si] !== undefined) { total += data[si]; count++; }
      });
      series.push(count > 0 ? total / count : null);
    });
    pts.push(series);
  });

  var allVals = [];
  pts.forEach(function(s) { s.forEach(function(v) { if (v !== null) allVals.push(v); }); });
  var minV = allVals.length > 0 ? Math.min.apply(null, allVals) : 0;
  var maxV = allVals.length > 0 ? Math.max.apply(null, allVals) : 100;
  if (maxV === minV) maxV = minV + 10;

  function x(i) { return padL + (i / (periods.length - 1)) * (W - padL - padR); }
  function y(v) { return padT + ((maxV - v) / (maxV - minV)) * (H - padT - padB); }

  var svg = '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:130px;display:block;background:var(--surface);border:1px solid var(--border);">';
  pts.forEach(function(series, ai) {
    var pathD = '';
    series.forEach(function(v, i) {
      if (v === null) return;
      pathD += (pathD === '' ? 'M' : 'L') + x(i).toFixed(1) + ',' + y(v).toFixed(1);
    });
    if (pathD) svg += '<path d="'+pathD+'" fill="none" stroke="'+axColors[ai]+'" stroke-width="1.6"/>';
    series.forEach(function(v, i) {
      if (v === null) return;
      svg += '<circle cx="'+x(i).toFixed(1)+'" cy="'+y(v).toFixed(1)+'" r="2.2" fill="'+axColors[ai]+'"/>';
    });
  });
  svg += '</svg>';

  svg += '<div style="display:flex;justify-content:space-between;margin-top:4px;">';
  periodLabels.forEach(function(pl) {
    svg += '<span style="font-size:9px;color:var(--ink-muted);">'+pl+'</span>';
  });
  svg += '</div>';

  return svg;
}

function updateSurveyPeople() {

  sel.innerHTML = '<option value="">-- '+t('Chọn người','Select person')+' --</option>';

    sel.innerHTML += '<option value="'+p.id+'">'+p.name+' — '+p.pos+'</option>';
  });
  updateSurveyWeak();
}

function updateSurveyWeak() {
  var personId = document.getElementById('svPerson').value;
  var weakDiv = document.getElementById('svWeak');
  if (!personId || !weakDiv) { if(weakDiv) weakDiv.innerHTML = ''; return; }
  var person = PEOPLE.find(function(p) { return p.id === personId; });
  if (!person) return;
  var scores = getEffectiveScores(person);
  var tgt = getTarget(person);
  var weakSkills = [];
  SKILLS.forEach(function(sk, i) {
    var gap = (scores[i] === null || scores[i] === undefined) ? -tgt[i] : scores[i] - tgt[i];
    if (gap < 0) weakSkills.push({ name: skillName(i), gap: gap, course: SKILL_COURSE[i] });
  });
  weakSkills.sort(function(a, b) { return a.gap - b.gap; });
  if (weakSkills.length === 0) { weakDiv.innerHTML = ''; return; }
  var html = '<div style="font-size:11.5px;color:var(--ink-muted);margin-bottom:4px;">'+t('Ba năng lực thiếu nhiều nhất','Top three biggest gaps')+':</div>';
  html += '<div style="display:flex;flex-wrap:wrap;gap:6px;">';
  weakSkills.slice(0, 5).forEach(function(ws) {
    html += '<span style="background:#FDF0E4;color:#A0551F;border:1px solid #F8D9B8;padding:3px 9px;font-size:11px;">'+ws.name+' ('+ws.gap+') '+(ws.course||'')+'</span>';
  });
  html += '</div>';
  weakDiv.innerHTML = html;
}

function submitSurvey() {
  var gl = document.getElementById('svGL').value.trim();
  var team = document.getElementById('svTeam').value;
  var personId = document.getElementById('svPerson').value;
  var hours = parseInt(document.getElementById('svHours').value) || 0;
  var other = document.getElementById('svOther').value.trim();
  var picks = [];
  for (var i = 1; i <= 3; i++) {
    var v = document.getElementById('svPick'+i).value;
    if (v) picks.push(v);
  }
  if (!personId) { alert(t('Vui lòng chọn người','Please select a person')); return; }
  if (!gl) { alert(t('Vui lòng nhập tên GL','Please enter GL name')); return; }
  var person = PEOPLE.find(function(p) { return p.id === personId; });
  proposals.push({
    personId: personId, personName: person.name, team: team,
    courses: picks, other: other, hours: hours, gl: gl,
    date: new Date().toISOString().slice(0,10), status: 'pending'
  });
  saveState();
  renderPage();
}

function renderExam(el) {

function renderExamTable() {
  var period = document.getElementById('examPeriod').value;
  var container = document.getElementById('examContent');

  var skillHeaders = SKILLS.map(function(sk, i) {
    return '<th style="min-width:60px;text-align:center;font-size:10px;writing-mode:vertical-rl;transform:rotate(180deg);height:100px;padding:4px 0;"><span style="color:'+axisColor(sk.ax)+'">'+skillName(i)+'</span></th>';
  }).join('');

  var rows = PEOPLE.map(function(person) {
    var scores = (examScores[period] && examScores[period][person.id]) || [];
    var total = 0, count = 0;
    var cells = SKILLS.map(function(sk, i) {
      var val = scores[i];
      if (val !== null && val !== undefined) { total += val; count++; }
      var bg = val === null || val === undefined ? '#F1F2F7' : val >= 80 ? '#DFF0EA' : val >= 60 ? '#FDF0E4' : '#F6E1DE';
      return '<td style="text-align:center;background:'+bg+';padding:4px;"><input type="number" min="0" max="100" value="'+(val!==null&&val!==undefined?val:'')+'" style="width:40px;border:0;text-align:center;font-size:11px;background:transparent;" onchange="setExamScore(\''+period+'\',\''+person.id+'\','+i+',this.value)"></td>';
    }).join('');
    var avg = count > 0 ? Math.round(total / count) : '—';
    return '<tr><td style="position:sticky;left:0;background:var(--surface);z-index:2;padding:6px;font-size:12px;font-weight:500;white-space:nowrap;">'+person.name+'</td><td style="padding:4px;font-size:11px;">'+person.team+'</td><td style="padding:4px;font-size:11px;">'+person.pos+'</td>'+cells+'<td style="text-align:center;font-weight:600;background:#F7F8FB;">'+avg+'</td></tr>';
  }).join('');

  container.innerHTML = '<div class="table-wrap"><table style="width:100%;"><thead><tr><th style="position:sticky;left:0;z-index:3;background:var(--header);text-align:left;padding:6px;">'+t('Họ tên','Name')+'</th><th style="padding:4px;">'+t('Đội','Team')+'</th><th style="padding:4px;">'+t('Cấp','Tier')+'</th>'+skillHeaders+'<th style="text-align:center;background:#F7F8FB;">Avg</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}

function setExamScore(period, personId, skillIdx, value) {
  if (!examScores[period]) examScores[period] = {};
  if (!examScores[period][personId]) examScores[period][personId] = [];
  examScores[period][personId][skillIdx] = value === '' ? null : parseInt(value);
  saveState();
}

// a 28-length array, so every renderer works as before. This layer

// Column per SKILLS[] index — must stay in sync with 0002_matrix.sql
var SKILL_COLS = [

// ── Row ↔ array ──────────────────────────────────────────────
function scoresToRow(personId, period, scores) {
  var row = { person_id: personId, period: period };
  for (var i = 0; i < SKILL_COLS.length; i++) {
    var v = scores && scores[i];
    row[SKILL_COLS[i]] = (v === undefined || v === null) ? null : v;
  }
  return row;
}

// ── Load (Q12: once per page load, all periods) ──────────────
function loadMatrixFromCloud() {
  if (!sb) { renderPage(); return; }
  var from = sb.from('competency_matrix').select('*');
  from.then(function (res) {
    if (res.error) { sbOnline = false; renderPage(); return; }
    var rows = res.data || [];
    // Reset cloud-sourced rows, keep any local fallback
    matrixScores = {};
    rows.forEach(function (r) {
      var key = (r.period === matrixPeriod) ? r.person_id : r.person_id + '_' + r.period;
      var arr = [];
      for (var i = 0; i < SKILL_COLS.length; i++) arr.push(r[SKILL_COLS[i]]);
      matrixScores[key] = arr;
    });
    sbOnline = true;
    flushDirty();
    renderPage();
  });
}

// ── Save (optimistic: local array is already updated) ────────
function pushRowToCloud(personId) {
  if (!sb) { sbDirty[personId] = true; return; }
  var person = PEOPLE.find(function (p) { return p.id === personId; });
  if (!person) return;
  var scores = getEffectiveScores(person);
  sb.from('competency_matrix')
    .upsert(scoresToRow(personId, matrixPeriod, scores), { onConflict: 'person_id,period' })
    .then(function (res) {
      if (res.error) { sbDirty[personId] = true; toast(res.error.message, true); }
      else { delete sbDirty[personId]; toastDirty(); }
    });
}

// Retry any rows that failed earlier (Q14)
function flushDirty() {
  Object.keys(sbDirty).forEach(function (id) { delete sbDirty[id]; pushRowToCloud(id); });
}

// ── UI feedback (Q14) ────────────────────────────────────────
function toast(msg, isErr) {
  var el = document.getElementById('sbToast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'sbToast';
    el.style.cssText = 'position:fixed;bottom:16px;right:16px;z-index:999;padding:8px 14px;border-radius:6px;font:600 12px/1.4 var(--font);box-shadow:0 4px 14px rgba(0,0,0,.15);';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.background = isErr ? '#B5493A' : '#2F7355';
  el.style.color = '#fff';
  el.style.display = 'block';
  clearTimeout(el._t);
  el._t = setTimeout(function () { el.style.display = 'none'; }, 2600);
}

// Stale/offline badge, rendered above the matrix table
function sbBadgeHtml() {
  if (sbOnline) return '';
  if (!sb) return '';
  return '<div class="legend" style="background:#FBEADC;border-color:#F5A66E;color:#A0551F;">⚠ '
    + t('Không kết nối được máy chủ — đang hiển thị dữ liệu đã lưu cục bộ',
        'Server unreachable — showing locally cached data')
    + '</div>';
}

function toastDirty() {
  var n = Object.keys(sbDirty).length;
  if (n) toast(t('⚠ ' + n + ' thay đổi chưa lưu lên máy chủ', '⚠ ' + n + ' changes not yet synced'), true);
}
