/* ═══════════════════════════════════════════
   DESIGN SYSTEM — Hallmark (hex tokens)
   ═══════════════════════════════════════════ */
:root {
  /* Brand — SA1 palette (rgb 47,75,158) */
  --primary: #2F4B9E;
  --primary-hover: #24407F;
  --primary-light: #4062B5;
  --brand-bar: #4C6EF5;          /* SA1 top bar */
  --brand-tint: #EAF0FE;         /* SA1 active-nav fill */

  /* Level ramp 0–4 — derived from --primary (SA1 defines no ramp).
     Dark enough at 3–4 for white text. */
  --level-0: #E8ECF7;
  --level-1: #C9D3EE;
  --level-2: #A3B4DE;
  --level-3: #6C86C4;
  --level-4: #2F4B9E;

  /* Surfaces */
  --bg: #EFF1F8;
  --surface: #FFFFFF;
  --header: #EDEFF7;
  --border: #EDEBF7;
  --row-border: #F3F2FA;
  --rule-strong: #D8D5EA;        /* SA1 connector / emphasised rule */

  /* Ink */
  --ink: #17202B;
  --ink-muted: #64717F;
  --ink-dim: #B7BFC8;
  --ink-sidebar: #2F4B9E;        /* SA1 sidebar is white; text is brand */
  --ink-sidebar-dim: #8A99B5;
  --ink-nav: #5B6472;

  /* Semantic */
  --evidence-flag: #F5A66E;
  --axis-lean: #2F4B9E;
  --axis-soft: #1F6459;
  --axis-language: #F5A66E;
  --positive: #2F7355;
  --negative: #B5493A;

  /* Shape — SA1 uses 20px cards / 7-10px controls */
  --radius-card: 20px;
  --radius-ctl: 7px;
  --shadow-card: 0 4px 18px rgba(31, 53, 115, 0.07);

  --font: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --dur-short: 220ms;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow-x: hidden; }
body {
  font-family: var(--font);
  font-size: 13px;
  line-height: 1.5;
  color: var(--ink);
  background: var(--bg);
  font-variant-numeric: tabular-nums;
}
.app { display: flex; min-height: 100vh; }

/* ═══ SIDEBAR ═══ SA1: white rounded card, tinted active item */
.sidebar {
  width: 214px; flex: 0 0 214px;
  background: var(--surface);
  color: var(--ink);
  padding: 20px 0;
  display: flex; flex-direction: column;
  position: sticky; top: 0; align-self: flex-start;
  z-index: 10;
  border-radius: var(--radius-card);
  box-shadow: var(--shadow-card);
  border: 1px solid var(--border);
  margin: 12px;
  height: calc(100vh - 24px);
}
.sidebar-title { font-size: 16px; font-weight: 700; color: var(--ink); padding: 0 18px; letter-spacing: -0.01em; }
.sidebar-subtitle { font-size: 11px; color: var(--ink-muted); padding: 3px 18px 0; }
.sidebar-section { margin-top: 16px; }
.sidebar-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-dim); padding: 0 18px 4px; }
.nav-item {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 18px; cursor: pointer;
  color: var(--ink-muted); font-weight: 400;
  background: transparent; border: 0;
  text-align: left; width: 100%; font-family: var(--font); font-size: 13px;
  border-radius: var(--radius-ctl); margin: 0 12px; width: calc(100% - 24px);
}
.nav-item:hover { background: var(--brand-tint); color: var(--primary); }
.nav-item.active { background: var(--brand-tint); color: var(--primary); font-weight: 600; }
.nav-item .icon { width: 16px; height: 16px; opacity: 0.7; pointer-events: none; }
.nav-item.active .icon { opacity: 1; }
.sidebar-lang {
  display: flex; gap: 6px; padding: 12px 18px 0;
}
.lang-btn {
  flex: 1; padding: 5px 0; border: 1px solid var(--brand-tint);
  background: var(--brand-tint); color: var(--primary);
  cursor: pointer; font-size: 11px; font-weight: 600;
  border-radius: 3px; font-family: var(--font);
}
.lang-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.sidebar-footer {
  margin-top: auto; padding: 12px 18px 10px;
  font-size: 12px; color: var(--ink-sidebar);
  border-top: 1px solid var(--primary-light);
}
.sidebar-footer a { color: var(--ink-sidebar-dim); cursor: pointer; text-decoration: underline; font-size: 11px; background: none; border: 0; font-family: var(--font); }

/* ═══ MAIN ═══ */
.main { flex: 1 1 0; min-width: 0; margin-left: 0; padding-right: 28px; }
.page { display: none; padding: 20px 32px 60px 12px; max-width: 1400px; }
.page.active { display: block; }
.page h1 { font-size: 21px; font-weight: 600; margin: 0 0 6px; letter-spacing: -0.015em; }
.page-desc { color: var(--ink-muted); margin: 0 0 22px; max-width: 74ch; }

/* ═══ FILTER BUTTONS ═══ */
.filter-row { display: flex; align-items: center; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
.filter-btn {
  border: 1px solid var(--border); background: var(--surface);
  color: var(--ink-muted); padding: 4px 12px; cursor: pointer;
  font-size: 12px; font-family: var(--font); border-radius: 0;
}
.filter-btn.active { border-color: var(--primary); background: var(--primary); color: #fff; }
.filter-btn:hover:not(.active) { border-color: var(--primary); color: var(--primary); }

/* ═══ TABLE ═══ */
.table-wrap { overflow: auto; border: 1px solid var(--border); background: var(--surface); max-height: 70vh; }
table { border-collapse: separate; border-spacing: 0; width: 100%; }
th { background: var(--header); font-size: 11px; font-weight: 500; color: var(--ink-muted); border-bottom: 1px solid var(--border); padding: 6px; text-align: left; }
th.sticky-name { position: sticky; top: 0; left: 0; z-index: 4; min-width: 168px; }
th.sticky-tier { position: sticky; top: 0; left: 168px; z-index: 4; min-width: 74px; border-right: 1px solid var(--border); }
th.skill-col { position: sticky; top: 0; z-index: 3; height: 118px; width: 28px; padding: 0; cursor: pointer; }
th.skill-col:hover { background: var(--level-0); }
th.skill-col span { display: block; writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; padding: 8px 0; font-weight: 600; }
td { text-align: center; width: 28px; cursor: pointer; position: relative; border-bottom: 1px solid var(--row-border); padding: 5px 6px; background: var(--surface); }
td.sticky-name { position: sticky; left: 0; z-index: 2; min-width: 168px; text-align: left; font-size: 12px; line-height: 1.25; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
td.sticky-tier { position: sticky; left: 168px; z-index: 2; min-width: 74px; border-right: 1px solid var(--border); text-align: left; font-size: 11.5px; color: var(--ink-muted); }
td.met-col { text-align: right; font-size: 11.5px; color: var(--ink-muted); background: #F7F8FB; }

/* ═══ CELL LEVEL GRID ═══ */
.level-grid { display: grid; grid-template-columns: 7px 7px; grid-template-rows: 7px 7px; gap: 2px; justify-content: center; margin: 0 auto; width: 16px; }
.level-dot { width: 7px; height: 7px; display: block; }
.level-dot.filled { background: var(--primary); }
.level-dot.empty { background: var(--border); }

/* ═══ EVIDENCE FLAG ═══ */
.ev-flag { position: absolute; top: 1px; right: 1px; width: 0; height: 0; border-top: 5px solid var(--evidence-flag); border-left: 5px solid transparent; }

/* ═══ LEGEND ═══ */
.legend { display: flex; gap: 14px; align-items: center; margin-bottom: 16px; font-size: 11px; color: var(--ink-muted); }
.legend-dot { width: 9px; height: 9px; display: inline-block; vertical-align: middle; margin-right: 3px; }
.level-chip { width: 20px; height: 20px; display: inline-grid; place-items: center; font-size: 11px; font-weight: 600; }

/* ═══ MODAL ═══ */
.modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); z-index: 100; display: flex; align-items: center; justify-content: center; }
.modal { background: var(--surface); border-radius: 12px; padding: 24px; max-width: 480px; width: 90%; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
.modal h2 { font-size: 18px; font-weight: 600; margin-bottom: 16px; }
.modal-row { display: flex; gap: 8px; margin-bottom: 8px; }
.modal-row button { flex: 1; padding: 10px; border: 1px solid var(--border); background: var(--surface); border-radius: 6px; cursor: pointer; font-family: var(--font); font-size: 13px; font-weight: 500; }
.modal-row button:hover { border-color: var(--primary); color: var(--primary); }
.modal-close { background: none; border: 0; font-size: 20px; cursor: pointer; color: var(--ink-muted); float: right; }

/* ═══ EDITOR PANEL ═══ */
.editor-panel { background: var(--surface); border-radius: var(--radius-card); box-shadow: var(--shadow-card); padding: 24px; max-width: 400px; width: 100%; }
.editor-panel h3 { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
.editor-meta { font-size: 12px; color: var(--ink-muted); margin-bottom: 16px; }
.level-option { cursor: pointer; border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }
.level-option.selected { border-color: var(--primary); background: var(--level-0); box-shadow: inset 0 0 0 1px var(--primary); }
.level-option:hover:not(.selected) { border-color: var(--primary-light); }
.level-num { width: 28px; height: 28px; display: grid; place-items: center; font-size: 12px; font-weight: 700; border-radius: 4px; flex-shrink: 0; }
.level-title { font-weight: 600; font-size: 13px; }
.level-desc { font-size: 11px; color: var(--ink-muted); }
.editor-ev textarea { width: 100%; margin-top: 8px; padding: 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 12px; min-height: 60px; resize: vertical; font-family: var(--font); }
.editor-actions { display: flex; gap: 8px; margin-top: 12px; }
.editor-actions button { flex: 1; padding: 8px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 13px; font-family: var(--font); }
.btn-primary { background: var(--primary); color: #fff; }
.btn-secondary { background: var(--header); color: var(--ink-muted); }

/* ═══ CARDS ═══ */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-card); padding: 16px; margin-bottom: 16px; box-shadow: var(--shadow-card); }
.card-title { font-size: 14px; font-weight: 600; margin-bottom: 12px; }

/* ═══ KPI ROW ═══ */
.kpi-row { display: flex; gap: 1px; background: var(--border); border: 1px solid var(--border); margin: 20px 0; flex-wrap: wrap; }
.kpi-card { background: var(--surface); padding: 12px 18px; flex: 1 1 0; min-width: 150px; }
.kpi-value { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
.kpi-label { font-size: 11px; color: var(--ink-muted); margin-top: 2px; }

/* ═══ DONUT ═══ */
.donut-section { background: var(--surface); border: 1px solid var(--border); padding: 16px 18px; margin-top: 16px; }
.donut-section h2 { font-size: 13px; font-weight: 600; margin: 0 0 10px; }
.donut-row { display: flex; gap: 1px; background: var(--border); border: 1px solid var(--border); flex-wrap: wrap; margin-bottom: 10px; }
.donut-card { background: var(--surface); padding: 16px 18px; flex: 1 1 0; min-width: 150px; display: flex; align-items: center; gap: 16px; }
.donut-ring { width: 88px; height: 88px; border-radius: 50%; display: grid; place-items: center; position: relative; flex: 0 0 88px; }
.donut-ring-inner { position: absolute; inset: 10px; border-radius: 50%; background: var(--surface); display: flex; align-items: center; justify-content: center; }
.donut-pct { font-size: 16px; font-weight: 600; letter-spacing: -0.02em; }
.donut-label { font-size: 12px; color: var(--ink-muted); }
.donut-note { font-size: 11.5px; color: var(--ink-muted); margin: 0; line-height: 1.5; }

/* ═══ GAP BAR ═══ */
.gap-section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-card); box-shadow: var(--shadow-card); padding: 14px 18px; }
.gap-section h1 { font-size: 21px; font-weight: 600; margin: 0 0 6px; letter-spacing: -0.015em; }
.gap-section .page-desc { color: var(--ink-muted); margin: 0 0 22px; max-width: 74ch; }
.gap-item { display: grid; grid-template-columns: 172px minmax(0,1fr) 54px 96px; align-items: center; gap: 12px; padding: 3px 0; }
.gap-label { font-size: 12px; line-height: 1.25; font-weight: 500; }
.gap-label em { display: block; font-style: normal; font-size: 10px; color: var(--ink-muted); font-weight: 400; }
.gap-bar-wrap { position: relative; height: 15px; background: var(--level-0); }
.gap-bar-center { position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--ink-dim); }
.gap-bar { position: absolute; top: 2px; bottom: 2px; border-radius: 0; }
.gap-val { font-size: 12px; font-weight: 600; text-align: right; }
.gap-met { font-size: 11px; color: var(--ink-muted); }

/* ═══ TEAM TRENDS ═══ */
.trends-section { background: var(--surface); border: 1px solid var(--border); padding: 16px 18px; margin-bottom: 16px; }
.trends-section h2 { font-size: 13px; font-weight: 600; margin: 0 0 12px; }
.trends-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.trend-chart { }
.trend-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 6px; }
.trend-header strong { font-size: 12.5px; }
.trend-legend { display: flex; gap: 8px; }
.trend-legend span { display: flex; align-items: center; gap: 3px; font-size: 10px; color: var(--ink-muted); }
.trend-legend i { width: 7px; height: 7px; display: block; border-radius: 50%; }
.trend-svg { width: 100%; height: 90px; display: block; background: var(--header); border: 1px solid var(--row-border); }
.trend-xlabels { display: flex; justify-content: space-between; margin-top: 4px; }
.trend-xlabels span { font-size: 9px; color: var(--ink-dim); }

/* ═══ STATS SECTION ═══ */
.stats-section { background: var(--surface); border: 1px solid var(--border); padding: 16px 18px; }
.stats-section h2 { font-size: 13px; font-weight: 600; margin: 0 0 10px; }
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.stat-card { border: 1px solid var(--border); background: var(--header); padding: 12px 14px; }
.stat-card-title { font-weight: 600; font-size: 13px; margin-bottom: 9px; }
.stat-row { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-muted); padding: 3px 0; border-top: 1px solid var(--row-border); }
.stat-row b { color: var(--ink); font-weight: 600; }
.stat-bar-section { padding: 5px 0 3px; border-top: 1px solid var(--row-border); }
.stat-bar-label { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-muted); margin-bottom: 3px; }
.stat-bar-label b { font-weight: 600; }
.stat-bar { height: 5px; background: var(--row-border); border-radius: 2px; overflow: hidden; }
.stat-bar-fill { height: 100%; border-radius: 2px; }
.stat-note { font-size: 11.5px; color: var(--ink-muted); margin: 10px 0 0; line-height: 1.45; }

/* ═══ YEAR GRID ═══ */
.year-section { background: var(--surface); border: 1px solid var(--border); padding: 16px 18px; margin-top: 16px; }
.year-section h2 { font-size: 13px; font-weight: 600; margin: 0 0 10px; }
.year-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.year-card { border: 1px solid var(--border); background: var(--header); padding: 12px 14px; }
.year-card-title { font-weight: 600; font-size: 13px; margin-bottom: 9px; }
.year-card-row { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-muted); padding: 3px 0; border-top: 1px solid var(--row-border); }
.year-card-row b { color: var(--ink); font-weight: 600; }
.year-progress { height: 5px; background: var(--row-border); border-radius: 2px; overflow: hidden; margin-top: 8px; }
.year-progress-bar { height: 100%; background: var(--primary); border-radius: 2px; }
.year-note { font-size: 11.5px; color: var(--ink-muted); margin: 10px 0 0; line-height: 1.45; }

/* ═══ CALENDAR ═══ */
.cal-layout { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; align-items: start; }
.cal-grid-wrap { background: var(--surface); border: 1px solid var(--border); }
.cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); }
.cal-weekday { padding: 8px 6px; text-align: center; font-size: 11px; font-weight: 600; color: var(--ink-muted); background: var(--header); border-bottom: 1px solid var(--border); }
.cal-days { display: grid; grid-template-columns: repeat(7, 1fr); }
.cal-day { min-height: 76px; border-bottom: 1px solid var(--row-border); border-right: 1px solid var(--row-border); padding: 4px; display: flex; flex-direction: column; gap: 3px; background: var(--surface); }
.cal-day.empty { background: transparent; }
.cal-day-num { font-size: 10.5px; color: var(--ink-dim); }
.cal-day-badge { font-size: 9px; padding: 1px 4px; border-radius: 2px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.4; }
.cal-day-badge.session-a { background: var(--level-0); color: var(--primary); border-left: 2px solid var(--primary); }
.cal-day-badge.session-b { background: #E5EFEC; color: #2F7355; border-left: 2px solid #2F7355; }
.cal-day-badge.between { background: #FDF0E4; color: #A0551F; border-left: 2px solid #F5A66E; }
.cal-sidebar { display: flex; flex-direction: column; gap: 8px; }
.cal-session-card { text-align: left; border: 1px solid var(--border); border-left: 3px solid var(--primary); background: var(--surface); padding: 10px 12px; cursor: pointer; border-radius: 0; font-family: var(--font); }
.cal-session-card:hover { border-color: var(--primary); }
.cal-session-card.active { border-color: var(--primary); background: var(--level-0); }
.cal-session-card.type-b { border-left-color: #2F7355; }
.cal-session-card .session-label { font-size: 11px; color: var(--ink-dim); }
.cal-session-card .session-title { font-weight: 600; font-size: 12.5px; margin-top: 2px; }
.cal-session-card .session-meta { font-size: 11px; color: var(--ink-muted); margin-top: 3px; }
.cal-detail { background: var(--surface); border: 1px solid var(--border); padding: 16px 18px; margin-top: 8px; }
.cal-detail h3 { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
.cal-detail-row { font-size: 12px; margin-bottom: 6px; }
.cal-detail-row strong { color: var(--ink-muted); }
.cal-status { display: inline-block; font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 3px; }
.cal-status.planned { background: #E6ECFA; color: #24407F; border: 1px solid #C3D0EC; }
.cal-status.in-progress { background: #FBEADC; color: #A0551F; border: 1px solid #E9D8C6; }
.cal-status.done { background: #E5EFEC; color: #1F6459; border: 1px solid #C4DFD8; }
.cal-status.cancelled { background: #F6E8E6; color: #8C2B22; border: 1px solid #E8C7C2; }
.cal-legend { display: flex; gap: 6px; align-items: center; margin-bottom: 14px; font-size: 11px; color: var(--ink-muted); flex-wrap: wrap; }
.cal-legend span { display: flex; align-items: center; gap: 5px; }
.cal-legend i { width: 9px; height: 9px; display: block; border-radius: 1px; }

/* ═══ COURSES ═══ */
.course-section { margin-bottom: 20px; }
.course-section h2 { font-size: 13px; font-weight: 600; margin: 0 0 8px; }
.course-table-wrap { overflow: auto; border: 1px solid var(--border); background: var(--surface); max-height: 60vh; }
.course-table { width: 100%; border-collapse: collapse; }
.course-table th { background: var(--header); font-size: 11px; font-weight: 500; color: var(--ink-muted); border-bottom: 1px solid var(--border); padding: 6px 8px; text-align: left; position: sticky; top: 0; z-index: 2; white-space: nowrap; }
.course-table th.r { text-align: right; }
.course-table th.c { text-align: center; }
.course-table td { padding: 6px 8px; border-bottom: 1px solid var(--row-border); font-size: 12px; }
.course-table td.r { text-align: right; }
.course-table td.c { text-align: center; }
.course-table input[type="text"], .course-table input[type="number"], .course-table select {
  border: 1px solid var(--border); padding: 3px 6px; font-size: 11.5px; font-family: var(--font);
  background: var(--surface); width: 100%; border-radius: 3px;
}
.course-table input[type="text"]:hover, .course-table input[type="number"]:hover, .course-table select:hover {
  border-color: var(--primary-light);
}
.course-table input[type="text"]:focus, .course-table input[type="number"]:focus, .course-table select:focus {
  border-color: var(--primary); background: #fff; outline: none; box-shadow: 0 0 0 2px rgba(91,141,239,0.1);
}
.course-table input[type="number"] { text-align: right; }
.course-table input.code-input { font-family: var(--mono); font-size: 11.5px; background: var(--surface); }
.course-table input.code-input:hover { border-color: var(--primary-light); }
.course-table input.code-input:focus { background: #fff; }
.course-table input.w-tier { width: 100px; }
.course-table input.w-level { width: 34px; text-align: right; }
.course-table input.w-hours { width: 48px; text-align: right; }
.course-table input.w-cost { width: 70px; text-align: right; }
.course-table input.w-output { min-width: 160px; }
.course-table input.w-instructor { min-width: 110px; }
.course-table input.w-pass { width: 56px; text-align: right; }
.course-table .cert-count { font-weight: 600; cursor: pointer; }
.course-table .cert-count.has { color: var(--axis-soft); }
.course-table .cert-count.none { color: var(--ink-dim); }
.course-table .del-btn { border: 1px solid var(--border); background: var(--surface); padding: 2px 8px; cursor: pointer; color: var(--ink-muted); font-size: 11.5px; font-family: var(--font); }
.course-table .del-btn:hover { border-color: #B5493A; color: #B5493A; }
.course-add-btn { margin-top: 8px; border: 1px solid var(--border); background: var(--surface); padding: 5px 12px; cursor: pointer; color: var(--primary); font-size: 11.5px; font-family: var(--font); }
.course-add-btn:hover { border-color: var(--primary); }
.course-info-banner { background: #FAF3EC; border: 1px solid #E9D8C6; padding: 10px 14px; margin: 0 0 16px; font-size: 12px; line-height: 1.5; max-width: 96ch; }

/* ═══ SCALE ═══ */
.scale-item { display: flex; align-items: flex-start; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--row-border); }
.scale-num { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 6px; font-weight: 700; font-size: 14px; flex-shrink: 0; }
.scale-info h4 { font-size: 14px; font-weight: 600; }
.scale-info p { font-size: 12px; color: var(--ink-muted); }
.scale-info .ev-label { font-size: 11px; color: var(--primary); margin-top: 2px; }
.scale-info .who-label { font-size: 11px; color: var(--ink-dim); }

/* ═══ NOTIFICATION ═══ */
.notice { background: #FDF0E4; border: 1px solid #F8D9B8; border-radius: 6px; padding: 10px 14px; font-size: 12px; color: #A0551F; margin-bottom: 16px; }

/* ═══ SELECT ═══ */
select { padding: 6px 10px; border: 1px solid var(--border); border-radius: 4px; font-family: var(--font); font-size: 13px; }

/* ═══ TABS ═══ */
.tabs { display: flex; gap: 0; margin-bottom: 16px; border-bottom: 2px solid var(--border); }
.tab { padding: 8px 16px; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--ink-muted); background: none; border: 0; border-bottom: 2px solid transparent; margin-bottom: -2px; font-family: var(--font); }
.tab.active { color: var(--primary); border-bottom-color: var(--primary); }

/* ═══ FADE-UP REVEAL ═══ */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
#mainContent > * {
  animation: fadeUp var(--dur-short) var(--ease-out) both;
}
#mainContent > *:nth-child(1) { animation-delay: 0ms; }
#mainContent > *:nth-child(2) { animation-delay: 40ms; }
#mainContent > *:nth-child(3) { animation-delay: 80ms; }
#mainContent > *:nth-child(4) { animation-delay: 120ms; }
#mainContent > *:nth-child(5) { animation-delay: 160ms; }
#mainContent > *:nth-child(6) { animation-delay: 200ms; }
#mainContent > *:nth-child(n+7) { animation-delay: 240ms; }
@media (prefers-reduced-motion: reduce) {
  #mainContent > * { animation: none; opacity: 1; transform: none; }
}

/* ═══ PRINT ═══ */
@media print {
  .sidebar { display: none !important; }
  .page { padding: 10px !important; }
  .filter-btn, .nav-item, button { display: none !important; }
  .table-wrap { max-height: none !important; overflow: visible !important; }
  body { background: #fff; }
}

/* ═══ MOBILE ═══ */
@media (max-width: 768px) {
  .sidebar { position: fixed; left: -214px; top: 0; transition: left 0.3s; z-index: 100; margin: 0; height: 100vh; border-radius: 0; }
  .sidebar.open { left: 0; }

  .trends-grid { grid-template-columns: 1fr; }
  .stats-grid { grid-template-columns: 1fr; }
  .menu-toggle { display: block !important; }
}
.menu-toggle { display: none; position: fixed; top: 10px; left: 10px; z-index: 101; background: var(--primary); color: #fff; border: 0; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 16px; }

<script>
// ═══════════════════════════════════════════
// DATA — from original Claude artifact
// ═══════════════════════════════════════════

var SKILLS = [
  { n: "6S", ax: "A" }, { n: "8 Lãng phí", ax: "A" }, { n: "GEMBA", ax: "A" },
  { n: "Time Study & ECRS", ax: "A" }, { n: "VSM", ax: "A" }, { n: "Line Balancing", ax: "A" },
  { n: "QCO", ax: "A" }, { n: "TPM", ax: "A" }, { n: "Andon", ax: "A" },
  { n: "KAIZEN", ax: "B" }, { n: "PDCA / A3", ax: "B" },
  { n: "AutoCAD 2D", ax: "A" }, { n: "SketchUp 3D", ax: "A" },
  { n: "TWI - Hướng dẫn việc", ax: "C" },
  { n: "LSS Yellow Belt", ax: "B" }, { n: "LSS Green Belt", ax: "B" }, { n: "LSS Black Belt", ax: "B" },
  { n: "Giao tiếp", ax: "C" }, { n: "Lắng nghe chủ động", ax: "C" }, { n: "Làm việc nhóm", ax: "C" },
  { n: "Giải quyết vấn đề", ax: "C" }, { n: "Tư duy phản biện", ax: "C" }, { n: "Lãnh đạo", ax: "C" },
  { n: "Thuyết trình", ax: "C" }, { n: "Phản hồi", ax: "C" }, { n: "Quản lý xung đột", ax: "C" },
  { n: "Sử dụng AI", ax: "C" }, { n: "Ngoại ngữ", ax: "C" }
];

var SKILLS_EN = ["6S","8 Wastes","GEMBA","Time Study & ECRS","VSM","Line Balancing","QCO","TPM","Andon",
  "KAIZEN","PDCA / A3","AutoCAD 2D","SketchUp 3D","TWI - Job Instruction",
  "LSS Yellow Belt","LSS Green Belt","LSS Black Belt",
  "Communication","Active Listening","Teamwork","Problem Solving","Critical Thinking",
  "Leadership","Presentation","Feedback","Conflict Management","AI Skills","Foreign Language"];

var AXIS = { A: "Kỹ thuật", B: "Ứng dụng", C: "Hành vi" };
var AXIS_EN = { A: "Technical", B: "Application", C: "Behavioral" };
// Teams follow employee_list.csv. 'ADMIN' and the blank-team row
// (Nguyễn Minh Quang) are intentionally excluded from the filter —
// see TEAM_UNASSIGNED below.
var TEAMS = ["LEAN IE", "LEAN CI", "LEAN TPM", "LEAN TECHNOLOGY"];
var TEAM_GL = {
  "LEAN IE": "Vương Quốc Bảo",
  "LEAN CI": "Nguyễn Thị Thanh Trang",
  "LEAN TPM": "",                    // no Group Leader assigned
  "LEAN TECHNOLOGY": "Chau Khách Huy"
};
// People in the CSV whose team isn't one of the LEAN_* teams.
// Declared before ORG_CHART because teamsUnder references it.
var TEAM_UNASSIGNED = "Other";

// Org chart visibility.
// Reporting lines confirmed: A.Manager above Team leader; IE → Bảo,
// CI → Trang, TECHNOLOGY → Huy; TPM and ADMIN have no GL and sit on
// the staff line.
var SHOW_ORG_CHART = true;
// ── ORG CHART ─────────────────────────────────────────────────
// Reporting lines, taken from the SA1 org chart and mapped onto the
// employee IDs in PEOPLE[]. 18 people, 5 tiers.
//
//   Nguyễn Minh Quang   (S.Manager)
//   └─ Chau Khách Huy   (A.Manager)
//      ├─ Vương Quốc Bảo (Team leader, LEAN IE)
//      │  └─ LEAN IE + LEAN TECHNOLOGY + LEAN TPM staff  (9)
//      └─ Nguyễn Thị Thanh Trang (Team leader, LEAN CI)
//         └─ LEAN CI staff + ADMIN (Liễu)                (5)
//
// ⚠ Reporting lines are organisational facts — verify them. They
// are NOT derived from employees.team (Bảo supervises three teams).
// Each leader's reports are grouped into TEAMS, and the people in
// each cluster come from PEOPLE[].team — so rosters stay in sync.
var ORG_CHART = {
  root: '23040301',                       // Nguyễn Minh Quang · S.Manager
  reports: {
    // A.Manager sits ABOVE the Team leaders — seniority order:
    // S.Manager → A.Manager → Team leader → Staff
    '23040301': ['21051708'],             // → Chau Khách Huy · A.Manager
    '21051708': ['23032701', '12080610']  // → the two Team leaders
  },
  // Each leader owns exactly one team — mirrors TEAM_GL.
  // TPM and ADMIN have no Group Leader, so their members are placed
  // directly on the staff line instead of under a leader node.
  teamsUnder: {
    '21051708': ['LEAN TECHNOLOGY'],      // Chau Khách Huy is also TECH GL
    '23032701': ['LEAN IE'],              // Vương Quốc Bảo
    '12080610': ['LEAN CI'],              // Nguyễn Thị Thanh Trang
    '23040301': ['LEAN TPM', TEAM_UNASSIGNED]
  },
  // Not in the employees table; drop this node to start at Quang.
  above: { id: 'SY', label: 'GM', name: 'SY', img: 'avatars/SY.jpg' }
};

// Short team labels for the org chart.
var ORG_TEAM_LABEL = {
  'LEAN IE':         'IE',
  'LEAN CI':         'CI',
  'LEAN TPM':        'TPM',
  'LEAN TECHNOLOGY': 'TECH'
};
function orgTeamLabel(team) {
  // TEAM_UNASSIGNED holds ADMIN (Liễu) + the blank-team row.
  if (team === TEAM_UNASSIGNED) return 'Admin';
  return ORG_TEAM_LABEL[team] || team;
}

// Badge colours per tier, from the SA1 org chart.
var ORG_TIER_COLOR = {
  'GM': '#0E8074', 'S.Manager': '#1D4ED8', 'A.Manager': '#15803D',
  'Team leader': '#15803D', 'Staff': '#2F4B9E'
};

// ── ORG CHART RENDER ──────────────────────────────────────────
function orgPerson(id) {
  return PEOPLE.find(function (p) { return p.id === id; }) || null;
}

function orgShortName(full) {
  // "Nguyễn Thị Thanh Trang" → "Trang"; keeps the chart compact.
  var parts = full.trim().split(/\s+/);
  return parts.length > 1 ? parts[parts.length - 1] : full;
}

function orgNodeHtml(id, size, override) {
  var p = orgPerson(id);
  var badge, name, img;
  if (override) {
    badge = override.label || 'Staff';
    name = override.name || id;
    img = override.img || '';
  } else if (p) {
    badge = p.pos; name = orgShortName(p.name); img = 'avatars/' + p.id + '.jpg';
  } else {
    badge = 'Staff'; name = id; img = '';
  }
  var color = ORG_TIER_COLOR[badge] || '#2F4B9E';
  var sz = size || 44;
  // Badge / name sizes scale with the avatar so the ratio holds at any size.
  var fs = Math.round(sz * 0.21 * 10) / 10;      // 8.4px at 40, 10.5px at 50
  var nfs = Math.round(sz * 0.26 * 10) / 10;     // name under the badge
  var ring = Math.max(2, Math.round(sz / 20));   // outer ring thickness
  var gap = Math.round(sz / 8);                 // avatar → badge
  var radius = Math.round(sz / 5);
  var initial = (name.charAt(0) || '?');
  var avatar
    = '<img src="' + img + '" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;"'
      + ' onerror="this.style.display=\'none\';this.parentNode.querySelector(\'.org-init\').style.display=\'flex\';">'
      + '<span class="org-init" style="display:none;position:absolute;inset:0;align-items:center;'
      + 'justify-content:center;font-size:' + Math.round(sz / 2.4) + 'px;font-weight:700;color:#fff;">'
      + initial + '</span>';

  return '<div style="display:flex;flex-direction:column;align-items:center;">'
    + '<div style="position:relative;width:' + sz + 'px;height:' + sz + 'px;flex:0 0 auto;'
    + 'border-radius:50%;box-shadow:0 0 0 ' + ring + 'px var(--surface),0 0 0 '
    + (ring * 2) + 'px ' + color + ';">'
    + avatar + '</div>'
    + '<div style="margin-top:' + gap + 'px;background:' + color + ';color:#fff;font-size:' + fs + 'px;'
    + 'font-weight:700;padding:' + Math.round(sz / 16) + 'px ' + Math.round(sz / 4.5)
    + 'px;border-radius:' + radius + 'px;'
    + 'letter-spacing:.03em;white-space:nowrap;">'
    + badge + '</div>'
    + '<div style="font-size:' + nfs + 'px;font-weight:600;text-align:center;margin-top:'
    + Math.round(sz / 13) + 'px;'
    + 'line-height:1.2;white-space:nowrap;">' + name + '</div>'
    + '</div>';
}

function renderOrgChart() {
  var line = 'var(--border)';
  var kids = ORG_CHART.reports[ORG_CHART.root] || [];
  var rootSize = 56, leadSize = 50, branchSize = 46;
  var stem = 18;   // vertical connector length
  var gapX = 20;   // horizontal spacing between siblings
  var gapY = 26;   // vertical spacing between wrapped rows

  // IDs already drawn as their own node (GM, root, managers, leaders).
  // Anyone in here is excluded from the team clusters so nobody is
  // rendered twice — e.g. Bảo is LEAN IE's leader *and* a member.
  var placed = {};
  (function mark(id) {
    if (!id || placed[id]) return;
    placed[id] = true;
    (ORG_CHART.reports[id] || []).forEach(mark);
  })(ORG_CHART.root);
  if (ORG_CHART.above && ORG_CHART.above.id) placed[ORG_CHART.above.id] = true;

  // A team cluster: label on top, then its people in a row.
  // leaderless=true pads the top with the height of the leader node
  // it doesn't have, so its people line up with everyone else's staff.
  function teamCluster(team, size, leaderless) {
    var members = PEOPLE.filter(function (p) {
      return p.team === team && !placed[p.id];
    });
    if (!members.length) return '';
    var out = '<div style="display:flex;flex-direction:column;align-items:center;'
      + 'justify-content:flex-end;">';
    if (leaderless) {
      // spacer matching node + badge + name block
      out += '<div style="height:' + Math.round(size * 1.72) + 'px;"></div>';
    }
    out += '<div style="background:var(--ink-muted);color:#fff;font-size:11px;font-weight:700;'
      + 'padding:3px 10px;border-radius:9px;letter-spacing:.04em;white-space:nowrap;">'
      + orgTeamLabel(team) + '</div>';
    out += '<div style="width:2px;height:12px;background:' + line + ';"></div>';
    out += '<div style="display:flex;gap:' + gapX + 'px;flex-wrap:wrap;'
      + 'justify-content:center;row-gap:' + (gapY - 6) + 'px;">';
    members.forEach(function (p) { out += orgNodeHtml(p.id, size); });
    out += '</div></div>';
    return out;
  }

  // Renders one node and, if it supervises teams, the connector +
  // a row of team clusters.
  function branch(id, size) {
    var teams = ORG_CHART.teamsUnder[id] || [];
    var reports = ORG_CHART.reports[id] || [];
    var out = '<div style="display:flex;flex-direction:column;align-items:center;">';
    out += orgNodeHtml(id, size);
    var children = reports.map(function (cid) { return branch(cid, size - 8); })
      .concat(teams.map(function (tm) { return teamCluster(tm, size - 10); }))
      .filter(Boolean);
    if (children.length) {
      out += '<div style="width:2px;height:' + stem + 'px;background:' + line + ';"></div>';
      out += '<div style="width:100%;border-top:2px solid ' + line + ';display:flex;'
        + 'gap:' + (gapX + 6) + 'px;flex-wrap:wrap;justify-content:center;row-gap:' + gapY + 'px;">'
        + children.join('') + '</div>';
    }
    out += '</div>';
    return out;
  }

  var html = '<h2>' + t('Sơ đồ tổ chức', 'Org chart') + '</h2>';
  html += '<div style="overflow-x:auto;padding:16px 12px 20px;">'
    + '<div style="display:flex;flex-direction:column;align-items:center;min-width:min-content;">';

  // Optional GM node above the data root
  if (ORG_CHART.above) {
    html += orgNodeHtml(ORG_CHART.above.id, rootSize, ORG_CHART.above);
    html += '<div style="width:2px;height:' + stem + 'px;background:' + line + ';"></div>';
  }

  html += orgNodeHtml(ORG_CHART.root, ORG_CHART.above ? leadSize : rootSize);
  // The root hosts both its direct reports and any leaderless teams.
  var rootTeams = (ORG_CHART.teamsUnder[ORG_CHART.root] || [])
    .map(function (tm) { return teamCluster(tm, branchSize - 10, true); }).filter(Boolean);
  var centre = kids.map(function (cid) { return branch(cid, branchSize); });
  var barStyle = 'width:100%;border-top:2px solid ' + line + ';';

  if (rootTeams.length) {
    // Split the leaderless teams either side of the managers so the
    // A.Manager stays on the vertical axis (grid: 1fr auto 1fr).
    var split = Math.ceil(rootTeams.length / 2);
    var left = rootTeams.slice(0, split);
    var right = rootTeams.slice(split);
    var cell = 'display:flex;gap:' + (gapX + 6) + 'px;flex-wrap:wrap;'
      + 'justify-content:center;align-items:flex-end;row-gap:' + gapY + 'px;';
    html += '<div style="width:2px;height:' + stem + 'px;background:' + line + ';"></div>';
    html += '<div style="' + barStyle + 'display:grid;'
      + 'grid-template-columns:1fr auto 1fr;column-gap:' + (gapX + 6) + 'px;'
      + 'align-items:stretch;">'
      + '<div style="' + cell + 'min-width:0;">' + left.join('') + '</div>'
      + '<div style="' + cell + '">' + centre.join('') + '</div>'
      + '<div style="' + cell + 'min-width:0;">' + right.join('') + '</div>'
      + '</div>';
  } else if (centre.length) {
    html += '<div style="width:2px;height:' + stem + 'px;background:' + line + ';"></div>';
    html += '<div style="' + barStyle + 'display:flex;gap:' + (gapX + 6) + 'px;'
      + 'flex-wrap:wrap;justify-content:center;row-gap:' + gapY + 'px;">'
      + centre.join('') + '</div>';
  }
  html += '</div></div>';
  return html;
}

// Load from localStorage
function loadState() {
  try {
    var d = JSON.parse(localStorage.getItem('lean_competency_v20') || '{}');
    if (d.scores) matrixScores = d.scores;
    if (d.evidence) matrixEvidence = d.evidence;
    if (d.confirmed) matrixConfirmed = d.confirmed;
    if (d.examScores) examScores = d.examScores;
    if (d.calendarStatus) calendarStatus = d.calendarStatus;
    if (d.proposals) proposals = d.proposals;
    if (d.lang) lang = d.lang;
    if (d.strictEvidence) strictEvidence = d.strictEvidence;
    if (d.calMonth) calMonth = d.calMonth;
    if (d.courseYear) courseYear = d.courseYear;
    if (d.courseRan) courseRan = d.courseRan;
    if (d.coursePass) coursePass = d.coursePass;
    if (d.courseDecision) courseDecision = d.courseDecision;
  } catch(e) {}
}

function saveState() {
  localStorage.setItem('lean_competency_v20', JSON.stringify({
    scores: matrixScores, evidence: matrixEvidence, confirmed: matrixConfirmed,
    examScores: examScores, calendarStatus: calendarStatus, proposals: proposals,
    lang: lang, strictEvidence: strictEvidence, calMonth: calMonth,
    courseYear: courseYear, courseRan: courseRan, coursePass: coursePass, courseDecision: courseDecision
  }));
}

function resetState() {
  matrixScores = {}; matrixEvidence = {}; matrixConfirmed = {};
  examScores = {}; calendarStatus = {}; proposals = [];
  courseRan = {}; coursePass = {}; courseDecision = {};
  localStorage.removeItem('lean_competency_v20');
}

function exportData() {
  var data = JSON.stringify({
    scores: matrixScores, evidence: matrixEvidence, confirmed: matrixConfirmed,
    examScores: examScores, calendarStatus: calendarStatus, proposals: proposals,
    exportDate: new Date().toISOString()
  }, null, 2);
  var blob = new Blob([data], {type: 'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'lean_competency_backup_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
}

function importData() {
  var input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = function(e) {
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(ev) {
      try {
        var d = JSON.parse(ev.target.result);
        if (d.scores) matrixScores = d.scores;
        if (d.evidence) matrixEvidence = d.evidence;
        if (d.confirmed) matrixConfirmed = d.confirmed;
        if (d.examScores) examScores = d.examScores;
        if (d.calendarStatus) calendarStatus = d.calendarStatus;
        if (d.proposals) proposals = d.proposals;
        saveState();
        renderPage();
        alert('Import thành công!');
      } catch(e) { alert('Lỗi import: ' + e.message); }
    };
    reader.readAsText(file);
  };
  input.click();
}

function t(vi, en) { return lang === 'vi' ? vi : (en || vi); }
function skillName(i) { return lang === 'vi' ? SKILLS[i].n : SKILLS_EN[i]; }
function axisName(ax) { return lang === 'vi' ? AXIS[ax] : AXIS_EN[ax]; }
function levelColor(v) {
  if (v === null || v === undefined) return { bg:'#F1F2F7', fg:'#B7BFC8' };
  var ramp = ['var(--level-0)','var(--level-1)','var(--level-2)','var(--level-3)','var(--level-4)'];
  return { bg: ramp[v], fg: v >= 3 ? '#FFFFFF' : '#17202B' };
}
function axisColor(ax) { return ax === 'C' ? 'var(--axis-soft)' : 'var(--primary)'; }
function getTarget(person) { return TARGET[person.team + '|' + person.pos] || []; }
function getScores(personId) { return matrixScores[personId] || null; }
function getEffectiveScores(person) {
  var custom = matrixScores[person.id];
  var base = custom ? custom.slice() : person.s.slice();
  if (strictEvidence) {
    var hasEv = !!(matrixEvidence[person.id] || '').trim();
    base = base.map(function(v) { return (v !== null && v !== undefined && v > 2 && !hasEv) ? 2 : v; });
  }
  return base;
}

// OVERVIEW
// ═══════════════════════════════════════════

function renderOverview(el) {
  // ── KPIs ──
  var totalMet = 0, totalMeasured = 0, peopleAt100 = 0, totalGaps = 0;
  PEOPLE.forEach(function(p) {
    var scores = getEffectiveScores(p);
    var tgt = getTarget(p);
    var met = 0, measured = 0;
    scores.forEach(function(v, i) {
      if (v !== null && v !== undefined) {
        measured++;
        if (v >= tgt[i]) met++;
        else totalGaps += (tgt[i] - v);
      } else { totalGaps += tgt[i]; }
    });
    totalMet += met;
    totalMeasured += measured;
    if (measured > 0 && met === measured) peopleAt100++;
  });
  var avgMet = totalMeasured > 0 ? Math.round(totalMet / totalMeasured * 100) : 0;

  // ── Gap chart data ──
  var gaps = SKILLS.map(function(sk, i) {
    var sum = 0, count = 0, metCount = 0;
    PEOPLE.forEach(function(p) {
      var scores = getEffectiveScores(p);
      var tgt = getTarget(p);
      if (scores[i] !== null && scores[i] !== undefined) {
        sum += (scores[i] - tgt[i]);
        count++;
        if (scores[i] >= tgt[i]) metCount++;
      } else { sum -= tgt[i]; count++; }
    });
    var avg = count > 0 ? sum / count : 0;
    return { name: skillName(i), gap: avg, ax: sk.ax, met: metCount, total: PEOPLE.length };
  }).sort(function(a, b) { return a.gap - b.gap; });
  var maxAbs = Math.max.apply(null, gaps.map(function(g) { return Math.abs(g.gap); })) || 1;

  // ── Donuts ──
  var coreScore = 0, coreTarget = 0, funcScore = 0, funcTarget = 0;
  PEOPLE.forEach(function(p) {
    var scores = getEffectiveScores(p);
    var tgt = getTarget(p);
    SKILLS.forEach(function(sk, i) {
      var v = scores[i] || 0;
      if (sk.ax === 'C') { coreScore += v; coreTarget += tgt[i]; }
      else { funcScore += v; funcTarget += tgt[i]; }
    });
  });
  var corePct = coreTarget > 0 ? Math.round(coreScore / coreTarget * 100) : 0;
  var funcPct = funcTarget > 0 ? Math.round(funcScore / funcTarget * 100) : 0;

  // ── Team Trends data ──
  var teams = TEAMS;
  var axisKeys = ['T', 'A', 'C'];
  var axisColors = { T: 'var(--primary)', A: 'var(--axis-language)', C: 'var(--axis-soft)' };
  var axisLabels = { T: t('Kỹ thuật', 'Technical'), A: t('Ứng dụng', 'Application'), C: t('Hành vi', 'Behavioral') };

  // ── Tier stats ──
  var tiers = TIER_ORDER.slice();
  var tierStats = {};
  tiers.forEach(function(ti) {
    tierStats[ti] = { count: 0, met: 0, measured: 0, gaps: 0, coreScore: 0, coreTarget: 0, funcScore: 0, funcTarget: 0 };
  });
  PEOPLE.forEach(function(p) {
    var tier = p.pos;
    if (!tierStats[tier]) return;
    var ts = tierStats[tier];
    var scores = getEffectiveScores(p);
    var tgt = getTarget(p);
    ts.count++;
    scores.forEach(function(v, i) {
      if (v !== null && v !== undefined) {
        ts.measured++;
        if (v >= tgt[i]) ts.met++;
        else ts.gaps += (tgt[i] - v);
        if (SKILLS[i].ax === 'C') { ts.coreScore += v; ts.coreTarget += tgt[i]; }
        else { ts.funcScore += v; ts.funcTarget += tgt[i]; }
      } else {
        ts.gaps += tgt[i];
        if (SKILLS[i].ax === 'C') ts.coreTarget += tgt[i];
        else ts.funcTarget += tgt[i];
      }
    });
  });

  // ── Function team stats ──
  var teamStats = {};
  teams.forEach(function(t) {
    teamStats[t] = { count: 0, met: 0, measured: 0, gaps: 0, coreScore: 0, coreTarget: 0, funcScore: 0, funcTarget: 0 };
  });
  PEOPLE.forEach(function(p) {
    var ts = teamStats[p.team];
    if (!ts) return;
    var scores = getEffectiveScores(p);
    var tgt = getTarget(p);
    ts.count++;
    scores.forEach(function(v, i) {
      if (v !== null && v !== undefined) {
        ts.measured++;
        if (v >= tgt[i]) ts.met++;
        else ts.gaps += (tgt[i] - v);
        if (SKILLS[i].ax === 'C') { ts.coreScore += v; ts.coreTarget += tgt[i]; }
        else { ts.funcScore += v; ts.funcTarget += tgt[i]; }
      } else {
        ts.gaps += tgt[i];
        if (SKILLS[i].ax === 'C') ts.coreTarget += tgt[i];
        else ts.funcTarget += tgt[i];
      }
    });
  });

  // ── Render ──
  var html = '';

  // 0. Org chart (top of page)
  if (SHOW_ORG_CHART) {
    html += '<div class="card" style="margin-bottom:20px;padding:20px 24px 24px;">' + renderOrgChart() + '</div>';
  }

  // 1. Gap chart
  html += '<div class="gap-section">';
  html += '<h1>' + t('Khoảng cách năng lực toàn hệ thống', 'Competency Gap Across the System') + '</h1>';
  html += '<p class="page-desc">' + t('Mỗi thanh hiển thị khoảng cách trung bình giữa mức hiện tại và mức yêu cầu trên 19 người. Thanh kéo dài về phía bên trái càng nhiều thì kỹ năng đó càng cần được ưu tiên đào tạo.', 'Each bar shows the average gap between current level and required level across 19 people. The longer a bar extends left, the higher that competency should be prioritized for training.') + '</p>';
  gaps.forEach(function(g) {
    var pct = (g.gap / maxAbs) * 50;
    var color = g.gap < -0.5 ? '#B5493A' : g.gap < 0 ? '#E8B79A' : '#2F7355';
    var left, width;
    if (g.gap < 0) {
      left = (50 + pct) + '%';
      width = Math.abs(pct) + '%';
    } else {
      left = '50%';
      width = (g.gap / maxAbs) * 50 + '%';
    }
    var axColor = g.ax === 'T' ? 'var(--primary)' : g.ax === 'C' ? 'var(--axis-soft)' : 'var(--axis-language)';
    html += '<div class="gap-item">';
    html += '<div class="gap-label" style="color:'+axColor+'">' + g.name + '<em>' + axisName(g.ax) + '</em></div>';
    html += '<div class="gap-bar-wrap"><div class="gap-bar-center"></div><div class="gap-bar" style="background:'+color+';left:'+left+';width:'+width+';"></div></div>';
    html += '<div class="gap-val" style="color:'+color+'">' + (g.gap >= 0 ? '+' : '') + g.gap.toFixed(2) + '</div>';
    html += '<div class="gap-met">' + g.met + '/' + g.total + ' met</div>';
    html += '</div>';
  });
  html += '</div>';

  // 2. KPI row
  html += '<div class="kpi-row">';
  html += '<div class="kpi-card"><div class="kpi-value">' + avgMet + '%</div><div class="kpi-label">' + t('Yêu cầu đạt được trung bình', 'Average requirement met') + '</div></div>';
  html += '<div class="kpi-card"><div class="kpi-value">' + peopleAt100 + '/' + PEOPLE.length + '</div><div class="kpi-label">' + t('Người đạt 100%', 'People at 100%') + '</div></div>';
  html += '<div class="kpi-card"><div class="kpi-value">' + Math.round(totalGaps) + '</div><div class="kpi-label">' + t('Khoảng cách kỹ năng còn lại', 'Skill gaps remaining') + '</div></div>';
  html += '<div class="kpi-card"><div class="kpi-value">0/24</div><div class="kpi-label">' + t('Buổi đào tạo hoàn thành', 'Training sessions completed') + '</div></div>';
  html += '<div class="kpi-card"><div class="kpi-value">0/' + COURSES.length + '</div><div class="kpi-label">' + t('Khóa học đã quyết định', 'Courses decided') + '</div></div>';
  html += '</div>';

  // 3. Team Trends SVG charts
  html += '<div class="trends-section">';
  html += '<h2>' + t('Xu hướng đội nhóm — % mức tối đa từ ma trận năng lực theo kỳ', 'Team Trends — % of max level from the competency matrix per period') + '</h2>';
  html += '<div class="trends-grid">';
  teams.forEach(function(team) {
    var ts = teamStats[team];
    if (!ts || ts.count === 0) return;
    html += '<div class="trend-chart">';
    html += '<div class="trend-header"><strong>' + team + '</strong><span class="trend-legend">';
    axisKeys.forEach(function(ax) {
      html += '<span><i style="background:' + axisColors[ax] + '"></i>' + axisLabels[ax] + '</span>';
    });
    html += '</span></div>';
    // SVG
    var svgW = 260, svgH = 100;
    html += '<svg class="trend-svg" viewBox="0 0 ' + svgW + ' ' + svgH + '">';
    // Compute axis averages for this team
    var axisAvgs = {};
    axisKeys.forEach(function(ax) {
      var score = 0, target = 0;
      PEOPLE.forEach(function(p) {
        if (p.team !== team) return;
        var scores = getEffectiveScores(p);
        var tgt = getTarget(p);
        SKILLS.forEach(function(sk, i) {
          if (sk.ax === ax) {
            score += (scores[i] || 0);
            target += tgt[i];
          }
        });
      });
      axisAvgs[ax] = target > 0 ? (score / target * 100) : 0;
    });
    // Draw lines (flat for now — only current period data)
    var periods = ['2024-1', '2024-2', '2025-1', '2025-2', '2026-1', '2026-2', '2027-1', '2027-2'];
    var xStep = svgW / (periods.length - 1);
    axisKeys.forEach(function(ax) {
      var val = axisAvgs[ax];
      var y = svgH - (val / 100 * svgH);
      var x1 = xStep * 5; // Jan 2026
      var x2 = xStep * 6; // Jul 2026
      html += '<line x1="' + x1 + '" y1="' + y + '" x2="' + x2 + '" y2="' + y + '" stroke="' + axisColors[ax] + '" stroke-width="1.6"></line>';
      html += '<circle cx="' + x1 + '" cy="' + y + '" r="2.2" fill="' + axisColors[ax] + '"></circle>';
      html += '<circle cx="' + x2 + '" cy="' + y + '" r="2.2" fill="' + axisColors[ax] + '"></circle>';
    });
    html += '</svg>';
    // X-axis labels
    var xLabels = ['Jan 2024', 'Jul 2024', 'Jan 2025', 'Jul 2025', 'Jan 2026', 'Jul 2026', 'Jan 2027', 'Jul 2027'];
    html += '<div class="trend-xlabels">';
    xLabels.forEach(function(l) { html += '<span>' + l + '</span>'; });
    html += '</div>';
    html += '</div>';
  });
  html += '</div></div>';

  // 4. Function team stats
  html += '<div class="stats-section">';
  html += '<h2>' + t('Theo đội nhóm', 'By function team') + '</h2>';
  html += '<div class="stats-grid">';
  teams.forEach(function(team) {
    var ts = teamStats[team];
    if (!ts || ts.count === 0) return;
    var reqPct = ts.measured > 0 ? Math.round(ts.met / ts.measured * 100) : 0;
    var gapsPer = ts.count > 0 ? (ts.gaps / ts.count).toFixed(1) : '0';
    var corePct = ts.coreTarget > 0 ? Math.round(ts.coreScore / ts.coreTarget * 100) : 0;
    var funcPct = ts.funcTarget > 0 ? Math.round(ts.funcScore / ts.funcTarget * 100) : 0;
    html += '<div class="stat-card">';
    html += '<div class="stat-card-title">' + team + '</div>';
    html += '<div class="stat-row"><span>' + t('Người', 'People') + '</span><b>' + ts.count + '</b></div>';
    html += '<div class="stat-bar-section"><div class="stat-bar-label"><span>' + t('Yêu cầu đạt được', 'Requirement met') + '</span><b>' + reqPct + '%</b></div><div class="stat-bar"><div class="stat-bar-fill" style="width:' + reqPct + '%;background:var(--ink);"></div></div></div>';
    html += '<div class="stat-row"><span>' + t('Khoảng cách/Người', 'Gaps / person') + '</span><b>' + gapsPer + '</b></div>';
    html += '<div class="stat-bar-section"><div class="stat-bar-label"><span>' + t('Cốt lõi', 'Core') + '</span><b style="color:var(--primary)">' + corePct + '%</b></div><div class="stat-bar"><div class="stat-bar-fill" style="width:' + corePct + '%;background:var(--primary);"></div></div></div>';
    html += '<div class="stat-bar-section"><div class="stat-bar-label"><span>' + t('Chức năng', 'Functional') + '</span><b style="color:var(--axis-language)">' + funcPct + '%</b></div><div class="stat-bar"><div class="stat-bar-fill" style="width:' + funcPct + '%;background:var(--axis-language);"></div></div></div>';
    html += '</div>';
  });
  html += '</div></div>';

  // 5. Tier stats
  html += '<div class="stats-section" style="margin-top:16px;">';
  html += '<h2>' + t('Theo cấp bậc', 'By tier') + '</h2>';
  html += '<div class="stats-grid">';
  tiers.forEach(function(ti) {
    var ts = tierStats[ti];
    if (!ts || ts.count === 0) return;
    var reqPct = ts.measured > 0 ? Math.round(ts.met / ts.measured * 100) : 0;
    var gapsPer = ts.count > 0 ? (ts.gaps / ts.count).toFixed(1) : '0';
    var corePct = ts.coreTarget > 0 ? Math.round(ts.coreScore / ts.coreTarget * 100) : 0;
    var funcPct = ts.funcTarget > 0 ? Math.round(ts.funcScore / ts.funcTarget * 100) : 0;
    html += '<div class="stat-card">';
    html += '<div class="stat-card-title">' + ti + '</div>';
    html += '<div class="stat-row"><span>' + t('Người', 'People') + '</span><b>' + ts.count + '</b></div>';
    html += '<div class="stat-bar-section"><div class="stat-bar-label"><span>' + t('Yêu cầu đạt được', 'Requirement met') + '</span><b>' + reqPct + '%</b></div><div class="stat-bar"><div class="stat-bar-fill" style="width:' + reqPct + '%;background:var(--ink);"></div></div></div>';
    html += '<div class="stat-row"><span>' + t('Khoảng cách/Người', 'Gaps / person') + '</span><b>' + gapsPer + '</b></div>';
    html += '<div class="stat-bar-section"><div class="stat-bar-label"><span>' + t('Cốt lõi', 'Core') + '</span><b style="color:var(--primary)">' + corePct + '%</b></div><div class="stat-bar"><div class="stat-bar-fill" style="width:' + corePct + '%;background:var(--primary);"></div></div></div>';
    html += '<div class="stat-bar-section"><div class="stat-bar-label"><span>' + t('Chức năng', 'Functional') + '</span><b style="color:var(--axis-language)">' + funcPct + '%</b></div><div class="stat-bar"><div class="stat-bar-fill" style="width:' + funcPct + '%;background:var(--axis-language);"></div></div></div>';
    html += '</div>';
  });
  html += '</div>';
  html += '<p class="stat-note">' + t('Ba cấp bậc gần bằng nhau — cấp bậc hiện tại chưa phản ánh năng lực. Nguyên nhân phổ biến: dữ liệu tự đánh giá và neo ở mức 2.', 'The three tiers are nearly equal — tier does not currently reflect competency. A common cause: the data is self-reported and anchored around level 2.') + '</p>';
  html += '</div>';

  // 6. Donuts
  html += '<div class="donut-section">';
  html += '<h2>' + t('Năng lực cốt lõi vs. Chức năng', 'Core vs. Functional Competency') + '</h2>';
  html += '<div class="donut-row">';
  html += '<div class="donut-card"><div class="donut-ring" style="background:conic-gradient(var(--primary) 0% '+corePct+'%, var(--row-border) '+corePct+'% 100%)"><div class="donut-ring-inner"><span class="donut-pct">'+corePct+'%</span></div></div><div class="donut-label">'+t('Cốt lõi','Core')+'</div></div>';
  html += '<div class="donut-card"><div class="donut-ring" style="background:conic-gradient(#F5A66E 0% '+funcPct+'%, var(--row-border) '+funcPct+'% 100%)"><div class="donut-ring-inner"><span class="donut-pct">'+funcPct+'%</span></div></div><div class="donut-label">'+t('Chức năng','Functional')+'</div></div>';
  html += '</div>';
  html += '<p class="donut-note">' + t('Theo mô hình SHRM: Cốt lõi bao gồm các năng lực hành vi áp dụng cho mọi vị trí (TWI, coaching, giao tiếp, làm việc nhóm, ngoại ngữ...); Chức năng bao gồm các năng lực kỹ thuật/ứng dụng chuyên biệt LEAN (6S, VSM, KAIZEN, Six Sigma...).', 'Per the SHRM model: Core covers behavioral competencies that apply to every role (TWI, coaching, communication, teamwork, foreign language...); Functional covers LEAN-specific technical/application competencies (6S, VSM, KAIZEN, Six Sigma...).') + '</p>';
  html += '</div>';

  // 7. Courses run across years
  html += '<div class="year-section">';
  html += '<h2>' + t('Khóa học theo năm', 'Courses run across years') + '</h2>';
  html += '<div class="year-grid">';
  ['2024','2025','2026','2027'].forEach(function(y) {
    html += '<div class="year-card">';
    html += '<div class="year-card-title">'+y+'</div>';
    html += '<div class="year-card-row"><span>'+t('Khóa học đã chạy','Courses run')+'</span><b>0</b>/<b>'+COURSES.length+'</b></div>';
    html += '<div class="year-card-row"><span>'+t('Chi phí','Cost')+'</span><b>0</b></div>';
    html += '<div class="year-progress"><div class="year-progress-bar" style="width:0%"></div></div>';
    html += '</div>';
  });
  html += '</div>';
  html += '<p class="year-note">' + t('Dựa trên đánh dấu "đã chạy" theo năm trên trang Khóa học.', 'Based on the "ran" mark per year on the Courses page.') + '</p>';
  html += '</div>';

  el.innerHTML = html;
}

// MATRIX
// ═══════════════════════════════════════════

function renderMatrix(el) {
  var html = '<h1>' + t('Ma trận năng lực', 'Competency Matrix') + '</h1>';
  html += '<p class="page-desc">' + t('Nhấn vào ô để đánh giá mức 0–4. Mức 3 và 4 yêu cầu bằng chứng — ô không có bằng chứng sẽ được đánh dấu.', 'Click a cell to rate level 0–4. Levels 3 and 4 require supporting evidence — cells without it are flagged.') + '</p>';

  // Period selector
  html += '<div class="filter-row"><span style="font-size:11px;font-weight:600;color:var(--ink-muted);margin-right:4px;">' + t('Kỳ', 'Period') + ':</span>';
  MATRIX_PERIODS.forEach(function(p) {
    var active = matrixPeriod === p;
    html += '<button class="filter-btn'+(active?' active':'')+'" onclick="matrixPeriod=\''+p+'\';saveState();renderPage();">'+(lang==='vi'?PERIOD_LABELS[p]:PERIOD_LABELS_EN[p])+'</button>';
  });
  html += '</div>';

  // Team filter
  html += '<div class="filter-row">';
  ['All'].concat(TEAMS, [TEAM_UNASSIGNED]).forEach(function(f) {
    html += '<button class="filter-btn'+(matrixFilter===f?' active':'')+'" onclick="matrixFilter=\''+f+'\';renderPage();">'+(f==='All'?t('Tất cả','All'):f)+'</button>';
  });
  html += '<span style="margin-left:auto;display:flex;align-items:center;gap:4px;">';
  for (var n = 0; n <= 4; n++) {
    var c = levelColor(n);
    html += '<span class="level-chip" style="background:'+c.bg+';color:'+c.fg+';">'+n+'</span>';
  }
  html += '</span></div>';

  // Axis legend
  html += '<div class="legend"><span><span class="legend-dot" style="background:var(--axis-lean)"></span>'+t('Kỹ thuật / Ứng dụng','Technical / Application')+'</span><span><span class="legend-dot" style="background:var(--axis-soft)"></span>'+t('Hành vi','Behavioral')+'</span></div>';

  // Server status badge (offline / not-synced)
  html += sbBadgeHtml();

  // Table
  var filtered = PEOPLE.filter(function(p) { return matrixFilter === 'All' || p.team === matrixFilter; });

  var skillHeaders = SKILLS.map(function(sk, idx) {
    return '<th class="skill-col" onclick="openSkillDetail('+idx+')" title="'+skillName(idx)+' ('+axisName(sk.ax)+') — '+t('xem chi tiết','click for details')+'"><span style="color:'+axisColor(sk.ax)+'">'+skillName(idx)+'</span></th>';
  }).join('');

  var thead = '<thead><tr><th class="sticky-name">'+t('Họ tên','Name')+'</th><th class="sticky-tier">'+t('Cấp','Tier')+'</th>'+skillHeaders+'<th style="text-align:right;padding:6px 10px;">Met%</th></tr></thead>';

  var rows = filtered.map(function(person) {
    var scores = getEffectiveScores(person);
    var tgt = getTarget(person);
    var met = 0, total = 0;
    var cells = SKILLS.map(function(sk, i) {
      var val = scores[i];
      var isNull = val === null || val === undefined;
      if (!isNull) { total++; if (val >= tgt[i]) met++; }
      var c = levelColor(val);
      var dots = '';
      for (var j = 0; j < 4; j++) {
        var filled = !isNull && j < val;
        dots += '<span class="level-dot '+(filled?'filled':'empty')+'"></span>';
      }
      var hasEv = !!(matrixEvidence[person.id] || '').trim();
      var flag = !isNull && val >= 3 && !hasEv;
      var prevScores = null;
      var delta = '';
      if (matrixPeriod !== '2024-1') {
        var pIdx = MATRIX_PERIODS.indexOf(matrixPeriod);
        if (pIdx > 0) {
          var prevKey = MATRIX_PERIODS[pIdx - 1];
          var prevCustom = matrixScores[person.id + '_' + prevKey];
          if (prevCustom && prevCustom[i] !== null && prevCustom[i] !== undefined && !isNull) {
            var d = val - prevCustom[i];
            if (d > 0) delta = '<span style="color:#2F7355;font-size:8px;position:absolute;bottom:0;right:2px;">+'+d+'</span>';
            else if (d < 0) delta = '<span style="color:#B5493A;font-size:8px;position:absolute;bottom:0;right:2px;">'+d+'</span>';
          }
        }
      }
      return '<td onclick="openCellEditor(\''+person.id+'\','+i+')" title="'+person.name+' · '+skillName(i)+' — '+t('Mục tiêu','Target')+': '+tgt[i]+'"><div class="level-grid">'+dots+'</div>'+(flag?'<div class="ev-flag"></div>':'')+delta+'</td>';
    }).join('');

    var ratio = SKILLS.length > 0 ? Math.round(met / SKILLS.length * 100) + '%' : '—';
    return '<tr><td class="sticky-name">'+person.name+'</td><td class="sticky-tier">'+person.pos+'</td>'+cells+'<td class="met-col">'+ratio+'</td></tr>';
  }).join('');

  html += '<div class="table-wrap"><table style="width:100%;">'+thead+'<tbody>'+rows+'</tbody></table></div>';
  el.innerHTML = html;
}

function openCellEditor(personId, skillIndex) {
  var person = PEOPLE.find(function(p) { return p.id === personId; });
  if (!person) return;
  var sk = SKILLS[skillIndex];
  var scores = getEffectiveScores(person);
  var currentVal = scores[skillIndex];
  var tgt = getTarget(person);
  var targetVal = tgt[skillIndex];
  var hasEv = !!(matrixEvidence[personId] || '').trim();

  var lv = ['var(--level-0)','var(--level-1)','var(--level-2)','var(--level-3)','var(--level-4)'];
  var lvFg = ['#17202B','#17202B','#17202B','#FFFFFF','#FFFFFF'];

  var levelsHtml = LEVELS.map(function(l) {
    var on = currentVal === l.v;
    var selLv = lang === 'vi' ? l : LEVELS_EN[l.v];
    return '<div class="level-option'+(on?' selected':'')+'" onclick="setMatrixScore(\''+personId+'\','+skillIndex+','+l.v+')">' +
      '<div class="level-num" style="background:'+lv[l.v]+';color:'+lvFg[l.v]+'">'+l.v+'</div>' +
      '<div><div class="level-title">'+selLv.t+'</div><div class="level-desc">'+selLv.d+'</div>' +
      '<div style="font-size:10px;color:var(--primary);margin-top:2px;">'+t('Bằng chứng: ','Evidence: ')+(l.self?t('Tự đánh giá','Self-assessed'):selLv.e)+' &middot; '+t('Xác nhận bởi','Confirmed by')+': '+selLv.who+'</div></div></div>';
  }).join('');

  var overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.onclick = function(e) { if (e.target === overlay) overlay.remove(); };

  var panel = document.createElement('div');
  panel.className = 'editor-panel';
  panel.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;">' +
    '<div><h3>'+person.name+'</h3><div class="editor-meta">'+person.team+' · '+person.pos+' · '+skillName(skillIndex)+' ('+t('Mục tiêu','Target')+': '+targetVal+')</div></div>' +
    '<button class="modal-close" onclick="this.closest(\'.modal-overlay\').remove()">&times;</button></div>' +
    levelsHtml +
    '<div class="editor-ev"><label style="font-size:12px;font-weight:600;color:var(--ink-muted);">'+t('Bằng chứng (bắt buộc cho mức 3–4)', 'Evidence (required for level 3–4)') + ':</label>' +
    '<textarea id="evInput" placeholder="'+t('VD: Kaizen cắt thời gian đổi model 12% trên line 3, tháng 4/2026, xác nhận bởi GL...', 'e.g. Kaizen cut changeover time 12% on line 3, April 2026, confirmed by GL...')+'">'+(matrixEvidence[personId]||'')+'</textarea></div>' +
    '<div style="margin-top:8px;display:flex;align-items:center;gap:8px;">' +
    '<label style="font-size:12px;"><input type="checkbox" id="confirmedCheck" '+(matrixConfirmed[personId+'_'+skillIndex]?'checked':'')+' onchange="toggleConfirm(\''+personId+'\','+skillIndex+',this.checked)"> '+t('Đã xác nhận','Confirmed')+'</label></div>' +
    '<div class="editor-actions"><button class="btn-primary" onclick="saveCellEditor(\''+personId+'\')">'+t('Lưu','Save')+'</button><button class="btn-secondary" onclick="this.closest(\'.modal-overlay\').remove()">'+t('Hủy','Cancel')+'</button></div>';

  overlay.appendChild(panel);
  document.body.appendChild(overlay);
}

function setMatrixScore(personId, skillIndex, value) {
  if (!matrixScores[personId]) {
    matrixScores[personId] = PEOPLE.find(function(p) { return p.id === personId; }).s.slice();
  }
  matrixScores[personId][skillIndex] = value;
  // Re-render editor
  document.querySelector('.modal-overlay').remove();
  openCellEditor(personId, skillIndex);
}

function toggleConfirm(personId, skillIndex, val) {
  matrixConfirmed[personId + '_' + skillIndex] = val;
  pushRowToCloud(personId);
}

function saveCellEditor(personId) {
  var input = document.getElementById('evInput');
  if (input) matrixEvidence[personId] = input.value;
  saveState();
  pushRowToCloud(personId);
  document.querySelector('.modal-overlay').remove();
  renderPage();
}

function openSkillDetail(skillIndex) {
  var sk = SKILLS[skillIndex];
  var name = skillName(skillIndex);

  // Compute stats
  var levelCounts = [0,0,0,0,0,0]; // 0-4 + null
  var teamCounts = {};
  TEAMS.forEach(function(t) { teamCounts[t] = [0,0,0,0,0,0]; });

  PEOPLE.forEach(function(p) {
    var scores = getEffectiveScores(p);
    var val = scores[skillIndex];
    if (val === null || val === undefined) { levelCounts[5]++; teamCounts[p.team][5]++; }
    else { levelCounts[val]++; teamCounts[p.team][val]++; }
  });

  var courseCode = SKILL_COURSE[skillIndex];
  var course = COURSES.find(function(c) { return c[0] === courseCode; });

  var overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.onclick = function(e) { if (e.target === overlay) overlay.remove(); };

  var panel = document.createElement('div');
  panel.className = 'modal';
  panel.style.maxWidth = '560px';

  var html = '<button class="modal-close" onclick="this.closest(\'.modal-overlay\').remove()">&times;</button>';
  html += '<h2 style="margin-bottom:4px;">'+name+'</h2>';
  html += '<div style="font-size:12px;color:var(--ink-muted);margin-bottom:16px;">'+axisName(sk.ax)+' &middot; '+t('Kỹ năng #','Skill #')+(skillIndex+1)+'</div>';

  // Level distribution
  html += '<div style="font-size:13px;font-weight:600;margin-bottom:8px;">'+t('Phân bố_level','Level Distribution')+'</div>';
  html += '<div style="display:flex;gap:4px;align-items:flex-end;height:80px;margin-bottom:16px;">';
  for (var i = 0; i <= 4; i++) {
    var count = levelCounts[i];
    var maxCount = Math.max.apply(null, levelCounts.slice(0,5)) || 1;
    var h = Math.max(4, (count / maxCount) * 70);
    var c = levelColor(i);
    html += '<div style="flex:1;display:flex;flex-direction:column;align-items:center;"><div style="font-size:10px;font-weight:600;margin-bottom:2px;">'+count+'</div><div style="width:100%;height:'+h+'px;background:'+c.bg+';border-radius:2px;"></div><div style="font-size:10px;color:var(--ink-muted);margin-top:2px;">'+i+'</div></div>';
  }
  html += '<div style="flex:1;display:flex;flex-direction:column;align-items:center;"><div style="font-size:10px;font-weight:600;margin-bottom:2px;">'+levelCounts[5]+'</div><div style="width:100%;height:4px;background:#F1F2F7;border-radius:2px;"></div><div style="font-size:10px;color:var(--ink-muted);margin-top:2px;">—</div></div>';
  html += '</div>';

  // By team
  html += '<div style="font-size:13px;font-weight:600;margin-bottom:8px;">'+t('Theo đội nhóm','By Team')+'</div>';
  html += '<table style="width:100%;font-size:12px;margin-bottom:16px;"><thead><tr><th style="text-align:left;">'+t('Đội','Team')+'</th><th>0</th><th>1</th><th>2</th><th>3</th><th>4</th><th>—</th></tr></thead><tbody>';
  TEAMS.forEach(function(t) {
    html += '<tr><td style="font-weight:600;">'+t+'</td>';
    for (var i = 0; i <= 5; i++) {
      html += '<td style="text-align:center;">'+teamCounts[t][i]+'</td>';
    }
    html += '</tr>';
  });
  html += '</tbody></table>';

  // Related course
  if (course) {
    var catIdx = course[8] || 0;
    var catLabels = ['Internal','Certification','Soft-skills','Tools'];
    html += '<div style="font-size:13px;font-weight:600;margin-bottom:8px;">'+t('Khóa học liên quan','Related Course')+'</div>';
    html += '<div class="course-card" style="cursor:default;"><div class="course-header"><div class="course-title">'+course[0]+' — '+course[1]+'</div><span class="course-badge badge-internal">'+catLabels[catIdx]+'</span></div>';
    html += '<div class="course-meta">'+axisName(course[2])+' · '+course[3]+' · '+course[6]+'h</div>';
    html += '<div style="font-size:12px;color:var(--ink-muted);margin-top:4px;">'+t('Đầu ra: ','Output: ')+course[7]+'</div></div>';
  }

  overlay.appendChild(panel);
  panel.innerHTML = html;
  document.body.appendChild(overlay);
}

var calSelectedSession = null;

function renderCalendar(el) {
  var months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var monthsVI = ['Tháng 1','Tháng 2','Tháng 3','Tháng 4','Tháng 5','Tháng 6','Tháng 7','Tháng 8','Tháng 9','Tháng 10','Tháng 11','Tháng 12'];
  var sched = lang === 'vi' ? SCHEDULE : SCHEDULE_EN;

  var html = '<h1>' + t('Lịch đào tạo 2026', 'Training Calendar 2026') + '</h1>';
  html += '<p class="page-desc">' + t('Mỗi tháng phủ 1 chủ đề qua 2 buổi. Buổi A truyền đạt nội dung tuần 2, buổi B ôn tập & coaching tuần 4. Hai tuần xen kẽ dành cho thực địa.', 'Each month covers one topic in two sessions. Session A delivers content in week 2, Session B reviews application in week 4. The two weeks in between are for real fieldwork.') + '</p>';

  // Month filter buttons
  html += '<div class="filter-row">';
  for (var m = 1; m <= 12; m++) {
    var active = calMonth === m;
    html += '<button class="filter-btn'+(active?' active':'')+'" onclick="calMonth='+m+';calSelectedSession=null;renderPage();">'+(lang==='vi'?monthsVI[m-1]:months[m-1])+'</button>';
  }
  html += '</div>';

  // Status legend
  html += '<div class="cal-legend">';
  html += '<span><i style="background:#E6ECFA;border:1px solid #C3D0EC;"></i>'+t('Chưa mở','Planned')+'</span>';
  html += '<span><i style="background:#FBEADC;border:1px solid #E9D8C6;"></i>'+t('Đang chạy','In progress')+'</span>';
  html += '<span><i style="background:#E5EFEC;border:1px solid #C4DFD8;"></i>'+t('Hoàn thành','Done')+'</span>';
  html += '<span><i style="background:#F6E8E6;border:1px solid #E8C7C2;"></i>'+t('Hoãn','Cancelled')+'</span>';
  html += '</div>';

  // Get sessions for this month
  var monthSessions = [];
  SCHEDULE.forEach(function(s, i) {
    if (s[0] === calMonth) monthSessions.push({ idx: i, data: s, en: SCHEDULE_EN[i] });
  });

  // Compute calendar grid for this month
  var year = 2026;
  var firstDay = new Date(year, calMonth - 1, 1).getDay(); // 0=Sun
  var daysInMonth = new Date(year, calMonth, 0).getDate();

  // Two-column layout
  html += '<div class="cal-layout">';

  // LEFT: Calendar grid
  html += '<div class="cal-grid-wrap">';
  // Weekday headers
  var weekdays = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  html += '<div class="cal-weekdays">';
  weekdays.forEach(function(w) { html += '<div class="cal-weekday">'+w+'</div>'; });
  html += '</div>';

  // Day cells
  html += '<div class="cal-days">';
  // Empty cells before day 1
  for (var e = 0; e < firstDay; e++) {
    html += '<div class="cal-day empty"></div>';
  }
  // Day cells
  for (var d = 1; d <= daysInMonth; d++) {
    html += '<div class="cal-day"><span class="cal-day-num">'+d+'</span>';
    // Check if any session falls in this day's week
    // Session A = week 2 (days 8-14), Session B = week 4 (days 22-28)
    monthSessions.forEach(function(ms) {
      var letter = ms.data[1];
      var isA = letter === 'A' && d >= 8 && d <= 14 && d % 7 === 1; // Mon of week 2
      var isB = letter === 'B' && d >= 22 && d <= 28 && d % 7 === 1; // Mon of week 4
      if (isA || isB) {
        var cls = isA ? 'session-a' : 'session-b';
        var title = lang === 'vi' ? ms.data[3] : ms.en[0];
        html += '<div class="cal-day-badge '+cls+'" onclick="calSelectedSession='+ms.idx+';renderPage();" title="'+title+'">'+letter+' · '+title.substring(0,20)+'</div>';
      }
    });
    html += '</div>';
  }
  html += '</div></div>';

  // RIGHT: Session detail sidebar
  html += '<div class="cal-sidebar">';
  monthSessions.forEach(function(ms) {
    var letter = ms.data[1];
    var title = lang === 'vi' ? ms.data[3] : ms.en[0];

    html += '<div class="session-title">'+title+'</div>';
    html += '<div class="session-meta">'+t('Chủ trì','Owner')+': '+owner+'</div>';
    html += '</button>';
  });
  html += '</div>';

  html += '</div>'; // cal-layout

  // Session detail panel
  if (calSelectedSession !== null && SCHEDULE[calSelectedSession]) {
    var ms = SCHEDULE[calSelectedSession];
    var en = SCHEDULE_EN[calSelectedSession] || [];
    var title = lang === 'vi' ? ms[3] : en[0];
    var type = lang === 'vi' ? ms[4] : en[1];
    var audience = lang === 'vi' ? ms[5] : en[2];
    var owner = lang === 'vi' ? ms[7] : en[3];
    var activity = lang === 'vi' ? ms[8] : en[4];
    var evidence = lang === 'vi' ? ms[9] : en[5];
    var status = calendarStatus[calSelectedSession] || STATUSES[0];
    var statusLabel = STATUS_LABEL[lang][status];
    var statusCls = status === STATUSES[0] ? 'planned' : status === STATUSES[1] ? 'in-progress' : status === STATUSES[2] ? 'done' : 'cancelled';

    html += '<div class="cal-detail">';
    html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">';
    html += '<h3 style="margin:0;">'+ms[1]+' · '+title+'</h3>';
    html += '<span class="cal-status '+statusCls+'">'+statusLabel+'</span></div>';
    html += '<div class="cal-detail-row"><strong>'+t('Loại buổi','Session type')+':</strong> '+type+'</div>';
    html += '<div class="cal-detail-row"><strong>'+t('Đối tượng','Audience')+':</strong> '+audience+' ('+ms[6]+'h)</div>';
    html += '<div class="cal-detail-row"><strong>'+t('Chủ trì','Owner')+':</strong> '+owner+'</div>';
    html += '<div class="cal-detail-row" style="margin-top:10px;"><strong>'+t('Hoạt động giữa buổi','Between-session activity')+':</strong></div>';
    html += '<div style="font-size:12px;margin-bottom:8px;">'+activity+'</div>';
    html += '<div class="cal-detail-row"><strong>'+t('Bằng chứng mong đợi','Expected evidence')+':</strong></div>';
    html += '<div style="font-size:12px;margin-bottom:12px;">'+evidence+'</div>';
    html += '<div><label style="font-size:11px;font-weight:600;color:var(--ink-muted);">'+t('Trạng thái','Status')+': </label>';
    html += '<select onchange="calendarStatus['+calSelectedSession+']=this.value;saveState();renderPage();" style="font-size:11px;padding:3px 6px;">';
    STATUSES.forEach(function(st) {
      html += '<option value="'+st+'"'+(status===st?' selected':'')+'>'+STATUS_LABEL[lang][st]+'</option>';
    });
    html += '</select></div>';
    html += '</div>';
  } else {
    html += '<p style="color:#A9B4BF;font-size:12.5px;margin-top:16px;">'+t('Chọn một buổi trên lịch để xem chi tiết.','Pick a session on the calendar to see details.')+'</p>';
  }

  el.innerHTML = html;
}

      html += '<td class="c"><input class="w-level" type="number" min="0" max="4" value="'+c[4]+'" onchange="COURSES['+idx+'][4]=+this.value;saveState();"> → <input class="w-level" type="number" min="0" max="4" value="'+c[5]+'" onchange="COURSES['+idx+'][5]=+this.value;saveState();"></td>';

      // % pass
      html += '<td class="r"><input class="w-pass" type="number" min="0" max="100" value="'+passVal+'" data-rp="'+rc+'" onchange="var k=this.dataset.rp;if(!coursePass['+courseYear+'])coursePass['+courseYear+']={};coursePass['+courseYear+'][k]=+this.value;saveState();"></td>';
      // Decision

      // Delete
      html += '<td><button class="del-btn" data-di="'+idx+'" onclick="var i=+this.dataset.di;if(confirm("'+t('Xóa khóa học này?','Delete this course?')+'")){COURSES.splice(i,1);saveState();renderPage();}">'+t('Xóa','Delete')+'</button></td>';
      html += '</tr>';
    });

    html += '</tbody></table></div>';
    html += '<button class="course-add-btn" onclick="COURSES.push([&quot;NEW&quot;,&quot;'+t('Khóa học mới','New course')+'&quot;,&quot;'+(catIdx<2?'A':'C')+'&quot;,&quot;Staff / L1&quot;,0,2,8,&quot;'+t('Đầu ra','Output')+'&quot;,'+catIdx+']);saveState();renderPage();">+ '+t('Thêm khóa học','Add course')+'</button>';
